{% extends "recommender/base.html" %}

{% block content %}
<section class="panel form-panel">
    <div class="section-head"><div><p class="eyebrow">Tune Your Engine</p><h2>Personalization setup</h2></div></div>
    <form method="post" class="profile-form">
        {% csrf_token %}
        <div class="field"><label for="{{ form.name.id_for_label }}">Name</label>{{ form.name }}</div>
        <div class="field"><label>Favorite domains</label><div class="checkbox-grid">{{ form.favorite_domains }}</div></div>
        <div class="field"><label>Favorite genres</label><div class="checkbox-grid">{{ form.favorite_genres }}</div></div>
        <div class="field-row">
            <div class="field"><label for="{{ form.current_mood.id_for_label }}">Current mood</label>{{ form.current_mood }}</div>
            <div class="field"><label for="{{ form.time_budget.id_for_label }}">Available time</label>{{ form.time_budget }}</div>
            <div class="field"><label for="{{ form.discovery_mode.id_for_label }}">Discovery mode</label>{{ form.discovery_mode }}</div>
        </div>
        <button type="submit" class="primary-btn">Save profile</button>
    </form>
</section>
{% endblock %}
